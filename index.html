<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse - Social Feed & Real-Time Messaging</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                            950: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.7); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200">

    <div id="app" class="h-full flex flex-col overflow-hidden relative">

        <!-- TOAST CONTAINER -->
        <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

        <!-- AUTHENTICATION SCREEN -->
        <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl rounded-3xl max-w-md w-full p-6 md:p-8 relative overflow-hidden">
                
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/10 text-indigo-600 dark:text-indigo-400 mb-3">
                        <i class="fa-solid fa-bolt text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Pulse</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" id="auth-subtitle">Connect, post thoughts & message in real-time</p>
                </div>

                <!-- Auth Navigation Tabs -->
                <div class="flex bg-slate-100 dark:bg-slate-800/80 p-1 rounded-2xl mb-6">
                    <button id="tab-signin" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-white dark:bg-slate-700 shadow text-slate-900 dark:text-white">Sign In</button>
                    <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Register</button>
                </div>

                <!-- Sign In Form -->
                <form id="form-signin" onsubmit="handleSignIn(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email or Username</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="text" id="signin-identifier" required class="w-full pl-9 pr-4 py-2.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white" placeholder="username or email">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="password" id="signin-password" required class="w-full pl-9 pr-4 py-2.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                        Sign In
                    </button>
                </form>

                <!-- Register Form -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Full Name</label>
                        <div class="relative">
                            <i class="fa-solid fa-id-card absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="text" id="reg-name" required class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white" placeholder="Sarah Connor">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Username</label>
                        <div class="relative">
                            <i class="fa-solid fa-at absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="text" id="reg-username" required pattern="^[a-zA-Z0-9_]+$" class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white" placeholder="sarah_c">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="email" id="reg-email" required class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white" placeholder="sarah@example.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="password" id="reg-password" required minlength="6" class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white" placeholder="At least 6 characters">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                        Create Account
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN MAIN APPLICATION LAYOUT -->
        <div id="main-app" class="h-full flex flex-col md:flex-row max-w-7xl w-full mx-auto overflow-hidden hidden">
            
            <!-- NAVIGATION SIDEBAR (DESKTOP) -->
            <aside class="w-64 border-r border-slate-200 dark:border-slate-800 p-4 hidden md:flex flex-col justify-between shrink-0 bg-white dark:bg-slate-900">
                <div class="space-y-6">
                    <!-- Brand Logo -->
                    <div class="flex items-center gap-3 px-3">
                        <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-xl shadow-md shadow-indigo-500/30">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Pulse</span>
                    </div>

                    <!-- Main Navigation Tabs -->
                    <nav class="space-y-1.5">
                        <button id="nav-feed-btn" onclick="switchMainView('feed')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-xs font-bold transition-all bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400">
                            <i class="fa-solid fa-newspaper text-base"></i> Feed & Posts
                        </button>
                        <button id="nav-chat-btn" onclick="switchMainView('chat')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                            <i class="fa-solid fa-comments text-base"></i> Messages <span id="unread-msg-badge" class="ml-auto bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full hidden">0</span>
                        </button>
                    </nav>
                </div>

                <!-- User Profile Summary at Sidebar Bottom -->
                <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden cursor-pointer" onclick="openProfileModal()">
                        <img id="sidebar-user-avatar" src="https://placehold.co/100" class="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-500/20">
                        <div class="truncate">
                            <p id="sidebar-user-name" class="text-xs font-bold text-slate-900 dark:text-white truncate">User Name</p>
                            <p id="sidebar-user-handle" class="text-[11px] text-slate-400 truncate">@handle</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <button onclick="toggleDarkMode()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">
                            <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
                        </button>
                        <button onclick="handleSignOut()" title="Sign Out" class="p-2 text-red-400 hover:text-red-600 text-xs">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- VIEW 1: SOCIAL FEED & POSTS AREA -->
            <section id="view-feed" class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-950">
                <!-- Top Feed Bar -->
                <header class="h-14 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur shrink-0 z-10">
                    <h2 class="font-extrabold text-base text-slate-900 dark:text-white">Home Feed</h2>
                    
                    <!-- Feed Filters -->
                    <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-semibold">
                        <button onclick="setFeedFilter('foryou')" id="filter-foryou" class="px-3 py-1 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">For You</button>
                        <button onclick="setFeedFilter('latest')" id="filter-latest" class="px-3 py-1 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white">Latest</button>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-2xl mx-auto w-full">
                    
                    <!-- Floating Post Composer Card -->
                    <div class="glass-card border border-slate-200 dark:border-slate-800 rounded-3xl p-4 shadow-xl shadow-slate-200/50 dark:shadow-none">
                        <div class="flex gap-3">
                            <img id="composer-user-avatar" src="https://placehold.co/100" class="w-10 h-10 rounded-full object-cover">
                            <div class="flex-1">
                                <textarea id="post-input" oninput="handlePostInput(this)" rows="2" placeholder="What's happening in your universe?" class="w-full bg-transparent border-none focus:outline-none text-sm text-slate-900 dark:text-white placeholder-slate-400 resize-none"></textarea>
                                
                                <!-- Attached Image Preview inside composer -->
                                <div id="post-image-preview" class="hidden relative mt-2 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 max-h-52">
                                    <img id="preview-img-element" src="" class="w-full h-full object-cover">
                                    <button onclick="removePostImage()" class="absolute top-2 right-2 bg-slate-900/70 text-white rounded-full p-1.5 hover:bg-slate-900 transition">
                                        <i class="fa-solid fa-xmark text-xs"></i>
                                    </button>
                                </div>

                                <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <label class="p-2 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 rounded-xl cursor-pointer transition">
                                            <i class="fa-solid fa-image text-sm"></i>
                                            <input type="file" id="post-file-input" onchange="handlePostFileSelect(event)" accept="image/*" class="hidden">
                                        </label>
                                        <button onclick="addHashtagToPost()" class="p-2 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 rounded-xl transition">
                                            <i class="fa-solid fa-hashtag text-sm"></i>
                                        </button>
                                    </div>

                                    <div class="flex items-center gap-3">
                                        <span id="char-counter" class="text-[11px] font-semibold text-slate-400">0 / 280</span>
                                        <button onclick="submitNewPost()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-500/20 active:scale-95 transition">
                                            Pulse
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Timeline Posts Container -->
                    <div id="posts-timeline" class="space-y-4">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </section>

            <!-- VIEW 2: REAL-TIME MESSAGING / CHAT WORKSPACE -->
            <section id="view-chat" class="flex-1 flex flex-col md:flex-row h-full overflow-hidden bg-white dark:bg-slate-950 hidden">
                
                <!-- Channels & User Direct Messages Side Panel -->
                <aside class="w-full md:w-72 border-r border-slate-200 dark:border-slate-800 flex flex-col bg-slate-50 dark:bg-slate-900/50 shrink-0 h-full">
                    
                    <div class="p-3 border-b border-slate-200 dark:border-slate-800 flex gap-2">
                        <button id="chat-tab-channels" onclick="switchChatSubTab('channels')" class="flex-1 py-1.5 px-3 text-xs font-bold rounded-xl bg-indigo-600 text-white">
                            <i class="fa-solid fa-hashtag mr-1"></i> Rooms
                        </button>
                        <button id="chat-tab-users" onclick="switchChatSubTab('users')" class="flex-1 py-1.5 px-3 text-xs font-bold rounded-xl text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800">
                            <i class="fa-solid fa-users mr-1"></i> Users
                        </button>
                    </div>

                    <!-- Channels Container -->
                    <div id="chat-channels-list" class="flex-1 overflow-y-auto p-3 space-y-1">
                        <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 py-1">
                            <span>Public Rooms</span>
                            <button onclick="promptCreateChannel()" class="text-indigo-600 text-sm font-bold">+</button>
                        </div>
                        <div id="channels-items-container" class="space-y-1"></div>
                    </div>

                    <!-- Direct Message Users Container -->
                    <div id="chat-users-list" class="flex-1 overflow-y-auto p-3 space-y-1 hidden">
                        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 py-1">
                            Direct Messages
                        </div>
                        <div id="users-items-container" class="space-y-1"></div>
                    </div>
                </aside>

                <!-- Active Chat Conversation Room -->
                <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-950 relative overflow-hidden">
                    <header class="h-14 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur shrink-0">
                        <div class="flex items-center gap-3">
                            <div id="chat-active-icon" class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">
                                #
                            </div>
                            <div>
                                <h3 id="chat-active-title" class="font-bold text-slate-900 dark:text-white text-sm">#general</h3>
                                <p id="chat-active-desc" class="text-[10px] text-slate-400">Public group channel</p>
                            </div>
                        </div>
                    </header>

                    <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                        <!-- Messages dynamically rendered -->
                    </div>

                    <footer class="p-3 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
                        <form onsubmit="handleSendChatMessage(event)" class="flex items-center gap-2">
                            <input type="text" id="chat-message-input" placeholder="Type a message..." class="flex-1 py-2.5 px-4 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none border-none text-xs">
                            <button type="submit" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md transition">
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                            </button>
                        </form>
                    </footer>
                </main>
            </section>

            <!-- MOBILE BOTTOM NAVBAR -->
            <nav class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-around p-2 shrink-0">
                <button onclick="switchMainView('feed')" class="flex flex-col items-center gap-1 p-2 text-indigo-600">
                    <i class="fa-solid fa-newspaper text-lg"></i>
                    <span class="text-[10px] font-bold">Feed</span>
                </button>
                <button onclick="switchMainView('chat')" class="flex flex-col items-center gap-1 p-2 text-slate-400">
                    <i class="fa-solid fa-comments text-lg"></i>
                    <span class="text-[10px] font-bold">Chat</span>
                </button>
                <button onclick="openProfileModal()" class="flex flex-col items-center gap-1 p-2 text-slate-400">
                    <i class="fa-solid fa-user text-lg"></i>
                    <span class="text-[10px] font-bold">Profile</span>
                </button>
            </nav>
        </div>

        <!-- PROFILE EDIT / VIEW MODAL -->
        <div id="modal-profile" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl">
                <h3 class="text-base font-extrabold text-slate-900 dark:text-white mb-4">Edit Profile</h3>
                <form onsubmit="saveProfileChanges(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">Display Name</label>
                        <input type="text" id="edit-profile-name" required class="w-full px-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">Bio</label>
                        <textarea id="edit-profile-bio" rows="2" placeholder="Tell the world about yourself..." class="w-full px-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeProfileModal()" class="px-4 py-2 text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- REPLY / COMMENTS THREAD MODAL -->
        <div id="modal-comments" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
                <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
                    <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Replies & Discussion</h3>
                    <button onclick="closeCommentsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div id="comments-thread-container" class="flex-1 overflow-y-auto my-4 space-y-3">
                    <!-- Loaded dynamically -->
                </div>

                <form onsubmit="handleSendComment(event)" class="flex gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <input type="text" id="comment-input" required placeholder="Write a reply..." class="flex-1 px-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 rounded-xl border-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs">Reply</button>
                </form>
            </div>
        </div>

    </div>

    <!-- APPLICATION CONTROLLER & REAL-TIME ENGINE -->
    <script>
        // Global LocalStorage Persistence Keys
        const STORAGE_USERS = 'pulse_app_users_v1';
        const STORAGE_SESSION = 'pulse_app_session_v1';
        const STORAGE_POSTS = 'pulse_app_posts_v1';
        const STORAGE_MESSAGES = 'pulse_app_messages_v1';

        // Cross-tab Synchronization Broadcast Engine
        const broadcastChannel = new BroadcastChannel('pulse_sync_channel');

        // Application State
        const state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem(STORAGE_USERS) || '[]'),
            posts: JSON.parse(localStorage.getItem(STORAGE_POSTS) || '[]'),
            messages: JSON.parse(localStorage.getItem(STORAGE_MESSAGES) || '[]'),
            activeView: 'feed',
            feedFilter: 'foryou',
            activeChat: { id: 'general', type: 'channel', name: 'general' },
            channels: [
                { id: 'general', name: 'general', desc: 'Public group room' },
                { id: 'random', name: 'random', desc: 'Memes and fun' }
            ],
            postAttachment: null,
            activeCommentPostId: null
        };

        // Initialize App on DOM Ready
        window.addEventListener('DOMContentLoaded', () => {
            checkExistingSession();
            setupSyncListeners();
            seedDefaultDataIfEmpty();
        });

        // 1. SESSION & AUTH MANAGEMENT
        function checkExistingSession() {
            const savedSession = localStorage.getItem(STORAGE_SESSION);
            if (savedSession) {
                const user = state.users.find(u => u.uid === savedSession);
                if (user) {
                    state.currentUser = user;
                    launchApp();
                    return;
                }
            }
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function switchAuthTab(tab) {
            const isSignIn = tab === 'signin';
            document.getElementById('form-signin').classList.toggle('hidden', !isSignIn);
            document.getElementById('form-register').classList.toggle('hidden', isSignIn);
            document.getElementById('tab-signin').className = isSignIn
                ? 'flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-white dark:bg-slate-700 shadow text-slate-900 dark:text-white'
                : 'flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
            document.getElementById('tab-register').className = !isSignIn
                ? 'flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-white dark:bg-slate-700 shadow text-slate-900 dark:text-white'
                : 'flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;

            // Check if user already exists
            if (state.users.some(u => u.username === username || u.email === email)) {
                showToast('Username or Email is already registered', 'error');
                return;
            }

            const newUser = {
                uid: 'u_' + Date.now(),
                name,
                username,
                email,
                password,
                bio: 'Hey there! I am using Pulse.',
                avatar: `https://placehold.co/100x100/6366f1/white?text=${name.charAt(0).toUpperCase()}`
            };

            state.users.push(newUser);
            saveUsers();

            state.currentUser = newUser;
            localStorage.setItem(STORAGE_SESSION, newUser.uid);
            launchApp();
            showToast('Account created successfully!', 'success');
        }

        function handleSignIn(e) {
            e.preventDefault();
            const identifier = document.getElementById('signin-identifier').value.trim().toLowerCase();
            const password = document.getElementById('signin-password').value;

            const user = state.users.find(u => (u.email === identifier || u.username === identifier) && u.password === password);

            if (!user) {
                showToast('Invalid login credentials', 'error');
                return;
            }

            state.currentUser = user;
            localStorage.setItem(STORAGE_SESSION, user.uid);
            launchApp();
            showToast(`Welcome back, ${user.name}!`, 'success');
        }

        function handleSignOut() {
            localStorage.removeItem(STORAGE_SESSION);
            state.currentUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            showToast('Signed out successfully');
        }

        function launchApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');

            // Render User Header Profiles
            document.getElementById('sidebar-user-name').innerText = state.currentUser.name;
            document.getElementById('sidebar-user-handle').innerText = `@${state.currentUser.username}`;
            document.getElementById('sidebar-user-avatar').src = state.currentUser.avatar;
            document.getElementById('composer-user-avatar').src = state.currentUser.avatar;

            renderPosts();
            renderChatChannels();
            renderChatUsers();
            renderChatMessages();
        }

        // 2. SOCIAL FEED & POST CONTROLLER
        function handlePostInput(el) {
            const count = el.value.length;
            document.getElementById('char-counter').innerText = `${count} / 280`;
            if (count > 280) {
                document.getElementById('char-counter').classList.add('text-red-500');
            } else {
                document.getElementById('char-counter').classList.remove('text-red-500');
            }
        }

        function handlePostFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                state.postAttachment = evt.target.result;
                document.getElementById('preview-img-element').src = evt.target.result;
                document.getElementById('post-image-preview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function removePostImage() {
            state.postAttachment = null;
            document.getElementById('post-file-input').value = '';
            document.getElementById('post-image-preview').classList.add('hidden');
        }

        function addHashtagToPost() {
            const input = document.getElementById('post-input');
            input.value += ' #pulse ';
            input.focus();
            handlePostInput(input);
        }

        function submitNewPost() {
            const text = document.getElementById('post-input').value.trim();
            if (!text && !state.postAttachment) return;
            if (text.length > 280) {
                showToast('Post exceeds 280 character limit', 'error');
                return;
            }

            const newPost = {
                id: 'p_' + Date.now(),
                authorId: state.currentUser.uid,
                authorName: state.currentUser.name,
                authorUsername: state.currentUser.username,
                authorAvatar: state.currentUser.avatar,
                content: text,
                attachment: state.postAttachment,
                likes: [],
                reposts: [],
                comments: [],
                createdAt: Date.now()
            };

            state.posts.unshift(newPost);
            savePosts();
            broadcastSync('NEW_POST', newPost);

            document.getElementById('post-input').value = '';
            removePostImage();
            handlePostInput(document.getElementById('post-input'));
            renderPosts();
            showToast('Published your pulse!', 'success');
        }

        function toggleLikePost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const myUid = state.currentUser.uid;
            const idx = post.likes.indexOf(myUid);
            if (idx > -1) {
                post.likes.splice(idx, 1);
            } else {
                post.likes.push(myUid);
            }

            savePosts();
            broadcastSync('UPDATE_POST', post);
            renderPosts();
        }

        function toggleRepost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            const myUid = state.currentUser.uid;
            const idx = post.reposts.indexOf(myUid);
            if (idx > -1) {
                post.reposts.splice(idx, 1);
            } else {
                post.reposts.push(myUid);
            }

            savePosts();
            broadcastSync('UPDATE_POST', post);
            renderPosts();
        }

        function renderPosts() {
            const timeline = document.getElementById('posts-timeline');
            timeline.innerHTML = '';

            if (state.posts.length === 0) {
                timeline.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-stream text-3xl mb-2 opacity-50"></i>
                        <p class="text-xs">No posts yet. Be the first to pulse something!</p>
                    </div>`;
                return;
            }

            state.posts.forEach(post => {
                const isLiked = post.likes.includes(state.currentUser?.uid);
                const isReposted = post.reposts.includes(state.currentUser?.uid);
                const timeAgo = formatTimeAgo(post.createdAt);

                const card = document.createElement('div');
                card.className = 'glass-card border border-slate-200 dark:border-slate-800/80 rounded-3xl p-4 shadow-sm hover:shadow-md transition';

                card.innerHTML = `
                    <div class="flex gap-3">
                        <img src="${post.authorAvatar}" class="w-10 h-10 rounded-full object-cover shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-1.5 truncate">
                                    <span class="font-bold text-xs text-slate-900 dark:text-white truncate">${escapeHTML(post.authorName)}</span>
                                    <span class="text-[11px] text-slate-400 truncate">@${escapeHTML(post.authorUsername)}</span>
                                    <span class="text-slate-300 dark:text-slate-700">•</span>
                                    <span class="text-[10px] text-slate-400">${timeAgo}</span>
                                </div>
                            </div>

                            <p class="mt-2 text-xs text-slate-800 dark:text-slate-200 leading-relaxed whitespace-pre-line">${formatPostContent(post.content)}</p>

                            ${post.attachment ? `
                                <div class="mt-3 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 max-h-72">
                                    <img src="${post.attachment}" class="w-full h-full object-cover">
                                </div>
                            ` : ''}

                            <!-- Interaction Bar -->
                            <div class="mt-4 pt-2 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between text-xs text-slate-400">
                                <button onclick="openCommentsModal('${post.id}')" class="flex items-center gap-1.5 hover:text-indigo-600 transition">
                                    <i class="fa-regular fa-comment"></i>
                                    <span>${post.comments.length}</span>
                                </button>
                                <button onclick="toggleRepost('${post.id}')" class="flex items-center gap-1.5 ${isReposted ? 'text-emerald-500 font-bold' : 'hover:text-emerald-500'} transition">
                                    <i class="fa-solid fa-repeat"></i>
                                    <span>${post.reposts.length}</span>
                                </button>
                                <button onclick="toggleLikePost('${post.id}')" class="flex items-center gap-1.5 ${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'} transition">
                                    <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                    <span>${post.likes.length}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                timeline.appendChild(card);
            });
        }

        // 3. COMMENTS & THREAD MODAL
        function openCommentsModal(postId) {
            state.activeCommentPostId = postId;
            document.getElementById('modal-comments').classList.remove('hidden');
            renderCommentsThread();
        }

        function closeCommentsModal() {
            state.activeCommentPostId = null;
            document.getElementById('modal-comments').classList.add('hidden');
        }

        function handleSendComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text || !state.activeCommentPostId) return;

            const post = state.posts.find(p => p.id === state.activeCommentPostId);
            if (!post) return;

            const newComment = {
                id: 'c_' + Date.now(),
                authorName: state.currentUser.name,
                authorUsername: state.currentUser.username,
                authorAvatar: state.currentUser.avatar,
                text,
                createdAt: Date.now()
            };

            post.comments.push(newComment);
            savePosts();
            broadcastSync('UPDATE_POST', post);

            input.value = '';
            renderCommentsThread();
            renderPosts();
        }

        function renderCommentsThread() {
            const container = document.getElementById('comments-thread-container');
            container.innerHTML = '';

            const post = state.posts.find(p => p.id === state.activeCommentPostId);
            if (!post || post.comments.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">No replies yet.</p>';
                return;
            }

            post.comments.forEach(c => {
                const el = document.createElement('div');
                el.className = 'p-3 bg-slate-50 dark:bg-slate-800/50 rounded-2xl flex gap-3 text-xs';
                el.innerHTML = `
                    <img src="${c.authorAvatar}" class="w-7 h-7 rounded-full">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-900 dark:text-white">${escapeHTML(c.authorName)}</span>
                            <span class="text-[10px] text-slate-400">${formatTimeAgo(c.createdAt)}</span>
                        </div>
                        <p class="mt-1 text-slate-700 dark:text-slate-300">${escapeHTML(c.text)}</p>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // 4. REAL-TIME CHAT ENGINE
        function switchChatSubTab(tab) {
            document.getElementById('chat-channels-list').classList.toggle('hidden', tab !== 'channels');
            document.getElementById('chat-users-list').classList.toggle('hidden', tab !== 'users');

            document.getElementById('chat-tab-channels').className = tab === 'channels'
                ? 'flex-1 py-1.5 px-3 text-xs font-bold rounded-xl bg-indigo-600 text-white'
                : 'flex-1 py-1.5 px-3 text-xs font-bold rounded-xl text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800';
            
            document.getElementById('chat-tab-users').className = tab === 'users'
                ? 'flex-1 py-1.5 px-3 text-xs font-bold rounded-xl bg-indigo-600 text-white'
                : 'flex-1 py-1.5 px-3 text-xs font-bold rounded-xl text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800';
        }

        function renderChatChannels() {
            const container = document.getElementById('channels-items-container');
            container.innerHTML = '';

            state.channels.forEach(ch => {
                const isActive = state.activeChat.type === 'channel' && state.activeChat.id === ch.id;
                const btn = document.createElement('button');
                btn.onclick = () => selectChatRoom(ch.id, 'channel', `#${ch.name}`);
                btn.className = `w-full px-3 py-2 text-left rounded-xl text-xs font-bold flex items-center gap-2 transition ${
                    isActive 
                        ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;
                btn.innerHTML = `<i class="fa-solid fa-hashtag text-slate-400"></i> ${ch.name}`;
                container.appendChild(btn);
            });
        }

        function renderChatUsers() {
            const container = document.getElementById('users-items-container');
            container.innerHTML = '';

            const otherUsers = state.users.filter(u => u.uid !== state.currentUser?.uid);

            otherUsers.forEach(u => {
                const isActive = state.activeChat.type === 'user' && state.activeChat.id === u.uid;
                const btn = document.createElement('button');
                btn.onclick = () => selectChatRoom(u.uid, 'user', u.name);
                btn.className = `w-full px-3 py-2 text-left rounded-xl text-xs font-bold flex items-center gap-2 transition ${
                    isActive 
                        ? 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;
                btn.innerHTML = `
                    <img src="${u.avatar}" class="w-5 h-5 rounded-full object-cover">
                    <span class="truncate">${u.name}</span>
                `;
                container.appendChild(btn);
            });
        }

        function selectChatRoom(id, type, name) {
            state.activeChat = { id, type, name };
            document.getElementById('chat-active-title').innerText = name;
            document.getElementById('chat-active-desc').innerText = type === 'channel' ? 'Public channel' : 'Direct Message';
            document.getElementById('chat-active-icon').innerText = type === 'channel' ? '#' : name.charAt(0).toUpperCase();

            renderChatChannels();
            renderChatUsers();
            renderChatMessages();
        }

        function handleSendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;

            const newMsg = {
                id: 'm_' + Date.now(),
                senderId: state.currentUser.uid,
                senderName: state.currentUser.name,
                senderAvatar: state.currentUser.avatar,
                channelId: state.activeChat.type === 'channel' ? state.activeChat.id : null,
                recipientId: state.activeChat.type === 'user' ? state.activeChat.id : null,
                text,
                createdAt: Date.now()
            };

            state.messages.push(newMsg);
            saveMessages();
            broadcastSync('NEW_CHAT_MSG', newMsg);

            input.value = '';
            renderChatMessages();
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages-container');
            container.innerHTML = '';

            let filtered = [];
            if (state.activeChat.type === 'channel') {
                filtered = state.messages.filter(m => m.channelId === state.activeChat.id);
            } else {
                const u1 = state.currentUser.uid;
                const u2 = state.activeChat.id;
                filtered = state.messages.filter(m => 
                    (m.senderId === u1 && m.recipientId === u2) || 
                    (m.senderId === u2 && m.recipientId === u1)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-400 py-10">No messages here yet.</p>';
                return;
            }

            filtered.forEach(m => {
                const isMe = m.senderId === state.currentUser?.uid;
                const wrapper = document.createElement('div');
                wrapper.className = `flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : ''}`;

                wrapper.innerHTML = `
                    <img src="${m.senderAvatar}" class="w-7 h-7 rounded-full object-cover">
                    <div class="max-w-[70%]">
                        <div class="p-3 rounded-2xl text-xs ${
                            isMe 
                                ? 'bg-indigo-600 text-white rounded-tr-none' 
                                : 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white rounded-tl-none'
                        }">
                            ${escapeHTML(m.text)}
                        </div>
                        <span class="text-[9px] text-slate-400 block mt-1 ${isMe ? 'text-right' : ''}">${formatTimeAgo(m.createdAt)}</span>
                    </div>
                `;
                container.appendChild(wrapper);
            });

            container.scrollTop = container.scrollHeight;
        }

        function promptCreateChannel() {
            const name = prompt('Enter new room name:');
            if (name) {
                const id = name.toLowerCase().replace(/\s+/g, '-');
                state.channels.push({ id, name, desc: 'User created room' });
                renderChatChannels();
                selectChatRoom(id, 'channel', `#${name}`);
            }
        }

        // 5. PROFILE CONTROLLER
        function openProfileModal() {
            document.getElementById('edit-profile-name').value = state.currentUser.name;
            document.getElementById('edit-profile-bio').value = state.currentUser.bio || '';
            document.getElementById('modal-profile').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('modal-profile').classList.add('hidden');
        }

        function saveProfileChanges(e) {
            e.preventDefault();
            const name = document.getElementById('edit-profile-name').value.trim();
            const bio = document.getElementById('edit-profile-bio').value.trim();

            if (!name) return;

            state.currentUser.name = name;
            state.currentUser.bio = bio;

            saveUsers();
            launchApp();
            closeProfileModal();
            showToast('Profile updated!', 'success');
        }

        // 6. GENERAL UTILITIES & CROSS-TAB SYNC
        function switchMainView(view) {
            state.activeView = view;
            document.getElementById('view-feed').classList.toggle('hidden', view !== 'feed');
            document.getElementById('view-chat').classList.toggle('hidden', view !== 'chat');

            document.getElementById('nav-feed-btn').className = view === 'feed'
                ? 'w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-xs font-bold transition-all bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400'
                : 'w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';

            document.getElementById('nav-chat-btn').className = view === 'chat'
                ? 'w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-xs font-bold transition-all bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400'
                : 'w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800';
        }

        function broadcastSync(type, payload) {
            broadcastChannel.postMessage({ type, payload });
        }

        function setupSyncListeners() {
            broadcastChannel.onmessage = (event) => {
                const { type, payload } = event.data;
                if (type === 'NEW_POST' || type === 'UPDATE_POST') {
                    state.posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || '[]');
                    renderPosts();
                    if (state.activeCommentPostId) renderCommentsThread();
                } else if (type === 'NEW_CHAT_MSG') {
                    state.messages = JSON.parse(localStorage.getItem(STORAGE_MESSAGES) || '[]');
                    renderChatMessages();
                }
            };
        }

        function saveUsers() { localStorage.setItem(STORAGE_USERS, JSON.stringify(state.users)); }
        function savePosts() { localStorage.setItem(STORAGE_POSTS, JSON.stringify(state.posts)); }
        function saveMessages() { localStorage.setItem(STORAGE_MESSAGES, JSON.stringify(state.messages)); }

        function setFeedFilter(filter) {
            state.feedFilter = filter;
            document.getElementById('filter-foryou').className = filter === 'foryou' ? 'px-3 py-1 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'px-3 py-1 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white';
            document.getElementById('filter-latest').className = filter === 'latest' ? 'px-3 py-1 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'px-3 py-1 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white';
            renderPosts();
        }

        function formatPostContent(str) {
            if (!str) return '';
            return escapeHTML(str).replace(/#(\w+)/g, '<span class="text-indigo-600 dark:text-indigo-400 font-bold">#$1</span>');
        }

        function formatTimeAgo(timestamp) {
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
            return `${Math.floor(diff / 86400)}d`;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            toast.className = `${bg} text-white text-xs px-4 py-3 rounded-xl shadow-lg transition-all duration-300 pointer-events-auto`;
            toast.innerText = msg;
            
            const container = document.getElementById('toast-container');
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function seedDefaultDataIfEmpty() {
            if (state.posts.length === 0) {
                state.posts = [
                    {
                        id: 'p_demo_1',
                        authorId: 'u_demo',
                        authorName: 'Pulse Official',
                        authorUsername: 'pulse_app',
                        authorAvatar: 'https://placehold.co/100/6366f1/white?text=P',
                        content: 'Welcome to Pulse! Experience modern social posting alongside real-time chat rooms. Try creating a post or opening another browser tab! #pulse',
                        attachment: null,
                        likes: [],
                        reposts: [],
                        comments: [],
                        createdAt: Date.now() - 3600000
                    }
                ];
                savePosts();
            }
        }
    </script>
</body>
</html>
